name: 'schwarzdavid Mailservice Dev'

services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: mailservice
            POSTGRES_PASSWORD: mailservice
            POSTGRES_DB: mailservice
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U mailservice -d mailservice']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command: redis-server --requirepass ${REDIS_PASSWORD}
        ports:
            - '6379:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

    mailhog:
        image: mailhog/mailhog
        restart: unless-stopped
        ports:
            - '1025:1025' # SMTP
            - '8025:8025' # Web UI

    greenmail:
        image: greenmail/standalone:2.1.0
        restart: unless-stopped
        environment:
            GREENMAIL_OPTS: >-
                -Dgreenmail.setup.test.smtp
                -Dgreenmail.setup.test.imap
                -Dgreenmail.auth.disabled
                -Dgreenmail.hostname=0.0.0.0
        ports:
            - '3025:3025' # SMTP (inject bounce DSNs here)
            - '3143:3143' # IMAP (polled as the bounce mailbox)

volumes:
    postgres-data:
    redis-data:
