name: Release

on:
    release:
        types: [published]

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check

    backend-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter backend test:e2e

    frontend-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter frontend exec playwright install --with-deps chromium
            - run: pnpm --filter frontend test:e2e
            - if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-e2e-diagnostics
                  path: |
                      apps/frontend/playwright-report
                      apps/frontend/node_modules/.tmp/e2e/*.log
                  include-hidden-files: true
                  if-no-files-found: ignore

    images:
        needs: [check, backend-e2e, frontend-e2e]
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@v4
            - run: docker compose version
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  target: backend
                  load: true
                  tags: ghcr.io/schwarzdavid/mailer-backend:ci
                  cache-from: type=gha,scope=backend
                  cache-to: type=gha,mode=max,scope=backend
            - run: IMAGE_TAG=ci bash deploy/smoke-test.sh
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta-backend
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/schwarzdavid/mailer-backend
                  flavor: latest=false
                  tags: |
                      type=semver,pattern={{version}}
                      type=sha,format=short
                      type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  target: backend
                  push: true
                  tags: ${{ steps.meta-backend.outputs.tags }}
                  labels: ${{ steps.meta-backend.outputs.labels }}
                  cache-from: type=gha,scope=backend
