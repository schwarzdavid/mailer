name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    release:
        types: [published]

concurrency:
    group: ci-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: pnpm check

    backend-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: pnpm --filter backend test:e2e

    frontend-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: pnpm --filter frontend exec playwright install --with-deps chromium
            - run: pnpm --filter frontend test:e2e
            - if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-e2e-diagnostics
                  path: |
                      apps/frontend/playwright-report
                      apps/frontend/node_modules/.tmp/e2e/*.log
                  include-hidden-files: true
                  if-no-files-found: ignore

    image:
        needs: [check, backend-e2e, frontend-e2e]
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - uses: docker/setup-buildx-action@v4
            - run: docker compose version
            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/schwarzdavid/mailer-backend
                  flavor: latest=false
                  tags: |
                      type=semver,pattern={{version}}
                      type=sha,format=short
                      type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  target: backend
                  load: true
                  tags: |
                      ghcr.io/schwarzdavid/mailer-backend:ci
                      ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=backend
                  cache-to: type=gha,mode=max,scope=backend
            - run: IMAGE_TAG=ci pnpm --filter e2e test:smoke
            - if: github.event_name == 'release'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - if: github.event_name == 'release'
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: xargs -n1 docker push <<<"$TAGS"
